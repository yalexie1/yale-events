# Canonical Yale venues. Raw location strings are matched by (in order): room code ("LC 101"),
# sub-venue (`rooms`: implies the building and sets the room), name/alias, each comma-separated segment of the name, then street address. Unmatched venues with
# trustworthy coordinates fall back to the area of the nearest building below.
# Names and addresses are compared after normalization (case, punctuation, "&"/"and", St/Street...),
# and a leading "Yale " is ignored, so aliases don't need every spelling.
# Coordinates come from Localist's geocoding for that venue; omit them when unknown.

areas:
  central: Central Campus
  arts-district: Arts District (Chapel & York)
  science-hill: Science Hill & Hillhouse
  medical: Medical Campus
  west-campus: West Campus
  off-campus: Off Campus
  online: Online

