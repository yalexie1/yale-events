# Search shorthands: each line is a set of names for the same thing. Searching for any of them (as
# the whole query or part of it) also finds events that mention any other, in the title,
# description, venue, or host groups. Matching ignores case. Shorthands of up to 6 characters with
# no spaces ("YPU", "EP&E") match only as whole words.
#
# Buildings don't need entries here: their names and aliases in locations.yaml ("HQ", "WLH", "the
# Whale", "TD") already match events held there. Leave out shorthands that are ordinary words (YES,
# JOY, FOOT) or times (PM), and prefer a distinctive fragment ("Sexuality Studies") over listing every
# punctuation variant of a long name. A shorthand used for two things (YSM: Medicine and Music) goes
# with the one sources use most, so searching one full name doesn't pull in the other's events.
