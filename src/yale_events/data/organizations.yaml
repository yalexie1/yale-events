# Who puts on an event, for the "listed by" filters: residential colleges, schools, departments,
# and other offices, centers, and groups. An event belongs to an organization when any of these match:
#   sources:   the event came from one of these sources (sources.yaml ids)
#   groups:    one of the event's groups (Localist departments, Yale Connect orgs, ...) is listed here
#   group_contains: one of the event's groups contains this text, case-insensitive (club name suffixes)
#   locations: the event is held in one of these buildings (locations.yaml ids); colleges only
# One event can belong to several (Computer Science and Engineering & Applied Science). Groups not
# listed here don't show up as a filter; `yev uncategorized` lists them after a scrape. Quote a name
# that contains a comma inside {...}, or YAML splits it (the loader rejects the stray key).

colleges:
  - {id: benjamin-franklin, name: Benjamin Franklin, sources: [franklin], locations: [benjamin-franklin-college]}
  - {id: berkeley, name: Berkeley, locations: [berkeley-college]}
  - {id: branford, name: Branford, locations: [branford-college]}
