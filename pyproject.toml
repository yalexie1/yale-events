[project]
name = "yale-events"
version = "0.1.0"
description = "Scraper + normalized API for a unified feed of Yale events"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yale Xie", email = "yale.xie@yale.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "recurring-ical-events>=3.8.2",
    "sqlalchemy>=2.1.1",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
yev = "yale_events.cli:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
