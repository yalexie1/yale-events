# Registry of event sources. Adapters are chosen by `type`, not by site.
# Sources whose adapter doesn't exist yet are listed with `enabled: false` and a note, so this file
# doubles as the source inventory. Use `yev discover URL...` to check a new site for feeds.
#
# Coverage note (surveyed 2026-09-26): events.yale.edu has 187 Localist groups (departments, centers,
# cultural centers, Yale College, Library, museums, ISM, SOM, ...). `yale-central` already fetches
# every group, so any department that posts to Localist needs no separate source. The sources below
# are sites that keep their own calendars.
sources:
  # events.yale.edu's robots.txt disallows crawling; we use its documented Localist API lightly
  # (scheduled every 4-6h, ~1 req/s). Don't add per-event page fetches.
  - id: yale-central
    name: Yale Events Calendar
    type: localist
    url: https://events.yale.edu
    enabled: true
    options:
      days: 60

  # --- Schools with their own feeds ---------------------------------------------------------------

  # ~100 upcoming events (the feed may cap at 100). One RRULE event. LOCATION values start with a
  # "Location \n" label, and SUMMARY has HTML entities (&amp;).
  - id: law
    name: Yale Law School
    type: ical
    url: https://www.law.yale.edu/ylsevents.ics
    enabled: true
    default_category: talks
    default_location: Sterling Law Building
    options:
      # Registrar dates in the same feed: deadlines, fees, term boundaries, no-class days.
      exclude_title: '^(deadline|last day|\$\d+|\d+% tuition|reading period|examination period|course selection|only \w+ classes)|recess (begins|ends)|no classes will meet|term (begins|ends)'

  # 384 events for the season, home and away. Keep home games only; "[W]"/"[L]" result prefixes on
  # past games. Timed events are UTC; tournaments are all-day dates.
  - id: athletics
    name: Yale Athletics
    type: ical
    url: https://yalebulldogs.com/calendar.ashx/calendar.ics
    enabled: true
    tags: [Athletics]
    options:
      location_contains: New Haven
      title_strip: '^(\[[A-Z]\]\s*)?Yale University\s+'

  # Concrete CMS block that POSTs a form to a JSON endpoint: {events: [{id, title, date, startTime,
  # endTime, link, departments}]}. ~32 upcoming events across all SEAS departments incl. Computer
  # Science (cpsc.yale.edu redirects here). No location field; it's sometimes in the title.
  - id: engineering
    name: Yale Engineering
    type: engineering
    url: https://engineering.yale.edu/news-and-events/events/get_events/1421
    enabled: true  # also fetches each event's page (~30/run) for location and description
    default_category: talks

  # School of Medicine incl. Public Health, Child Study Center, and clinical departments (~650 events
  # per 90 days). The calendar page is a React app; its pager calls /website-api-data/ysm/feed-event-list/
  # (robots.txt allows it), which returns everything for the window in one request at pageSize 200+.
  # Department-internal audiences (OrganizationOnly, Restricted, SchoolOnly) are skipped.
  - id: medicine
    name: Yale School of Medicine
    type: ysm
    url: https://medicine.yale.edu/calendar/
    enabled: true
    default_category: talks

  # School of Music concerts (~95 per season), incl. ISM, the instrument collection, and Norfolk. The
  # events page's "Load More" calls /ajax/browse/get_items, which returns rendered cards; one request
  # gets them all, a second (free_admission filter) marks free ones. Cards have no year or end time.
  - id: music
    name: Yale School of Music
    type: yale-music
    url: https://music.yale.edu/events
    enabled: true
    tags: [Music]

  # Older Yale Drupal 7 calendars: the "All Upcoming" view, with ISO datetimes in the markup. No iCal
  # (the usual /calendar/ical paths 404). OISS's events are Yale Connect RSVPs republished here.
  - id: oiss
    name: Office of International Students & Scholars
    type: drupal-calendar
    url: https://oiss.yale.edu/calendar
    enabled: true
    default_category: social
  - id: nursing
    name: Yale School of Nursing
    type: drupal-calendar
    url: https://nursing.yale.edu/calendar
    enabled: true  # upcoming list was empty on 2026-09-26; one request per run to notice when it isn't
    default_category: talks
    default_location: School of Nursing

  # Pages embedding schema.org Event JSON-LD (generic `jsonld` adapter). Architecture's listing has
  # ~15 events (past and upcoming) and no feed; also runs events in New York and San Francisco.
  - id: architecture
    name: Yale School of Architecture
    type: jsonld
    url: https://www.architecture.yale.edu/calendar
    enabled: true
    default_category: talks

  # Peabody Museum public programs (a handful a month, often family events). Drupal view grouped by
  # month and day, one page, no feed; "Ongoing" items without dates are skipped.
  - id: peabody
    name: Yale Peabody Museum
    type: peabody
    url: https://peabody.yale.edu/events/upcoming
    enabled: true
    default_category: social
    default_location: Yale Peabody Museum

  # Jackson School runs its own Localist instance (jackson.yale.edu/events links into it); robots.txt
  # allows the API with Crawl-Delay 1. Includes World Fellows. Some events are cross-posted to
  # events.yale.edu; dedupe keeps the central copy.
  - id: jackson
    name: Jackson School of Global Affairs
    type: localist
    url: https://events.jackson.yale.edu
    enabled: true
    default_category: talks
    options:
      days: 90

  # MacMillan Center (area-studies councils and programs, ~100 upcoming): Drupal view, no feed.
  # ~8 listing pages plus one page per event (~90; robots.txt allows them) for the venue, description,
  # and host. About two thirds of its events are also on events.yale.edu (dedupe keeps the central copy).
  - id: macmillan
    name: MacMillan Center
    type: macmillan
    url: https://macmillan.yale.edu/events
    enabled: true
    default_category: talks

  # Yale Center for British Art: paged grid of exhibitions and programs (~7 pages), no feed. Tours,
  # family and access programs, talks; exhibitions are skipped (date ranges). Programs are not on
  # events.yale.edu.
  - id: ycba
    name: Yale Center for British Art
    type: ycba
    url: https://britishart.yale.edu/exhibitions-programs
    enabled: true
    default_category: exhibitions
    default_location: Yale Center for British Art

  # --- Residential colleges -----------------------------------------------------------------------

  # Public Google Calendars embedded on the college sites. calendar.google.com's robots.txt disallows
  # everything, but these public iCal addresses exist for calendar subscriptions; the user approved
  # fetching them once per scheduled run, like a calendar client (2026-09-26). Titles only, rarely
  # locations or descriptions. Franklin's feed goes back to 2017 (recurrences are expanded).
  - id: franklin
    name: Benjamin Franklin College
    type: ical
    url: https://calendar.google.com/calendar/ical/benjaminfranklincollege%40gmail.com/public/basic.ics
    enabled: true
    default_category: social
    default_location: Benjamin Franklin College
  - id: pauli-murray
    name: Pauli Murray College
    type: ical
    # Embedded on https://paulimurray.yalecollege.yale.edu/calendar-0 (not linked from the homepage).
    url: https://calendar.google.com/calendar/ical/ekpht4n98o9q1u3ktso0mphvek%40group.calendar.google.com/public/basic.ics
    enabled: true
    default_category: social
    default_location: Pauli Murray College
  - id: pierson
    name: Pierson College
    type: ical
    url: https://calendar.google.com/calendar/ical/a81i9d2jes2upffan9ev02q2us%40group.calendar.google.com/public/basic.ics
    enabled: false  # the embedded calendar isn't public: the iCal address returns 404
    default_category: social
    default_location: Pierson College
  - id: silliman
    name: Silliman College
    type: ical
    url: https://calendar.google.com/calendar/ical/414a41e65a878f5141f6f3ba6bea63a3601e213917058d2cd09ff1b91364bfeb%40group.calendar.google.com/public/basic.ics
    enabled: true
    default_category: social
    default_location: Silliman College

  # YaleSites (Drupal) event pages at /events/YYYY-MM-DD-slug with an `event-meta` block and
  # <time datetime="...">. No feed; one generic `yalesites` HTML adapter covers all of these.
  - id: timothy-dwight
    name: Timothy Dwight College
    type: yalesites
    url: https://timothydwight.yale.edu/
    enabled: true
    default_category: social
    default_location: Timothy Dwight College
  - id: chaplain
    name: Chaplain's Office
    type: yalesites
    url: https://chaplain.yale.edu/
    enabled: true
    default_category: religious
  - id: davenport
    name: Davenport College
    type: yalesites
    url: https://davenport.yale.edu/events
    enabled: true  # calendar was empty on 2026-09-26; one request per run to notice when it isn't
    default_category: social
    default_location: Davenport College
  - id: trumbull
    name: Trumbull College
    type: yalesites
    url: https://trumbull.yalecollege.yale.edu/calendar
    enabled: false  # older Drupal site, not YaleSites; its calendar showed "No events" on 2026-09-26
    default_category: social
    default_location: Trumbull College

  # No public event calendar found (re-surveyed 2026-09-26 via each site's sitemap.xml and nav, plus
  # the *.yalecollege.yale.edu hosts): Berkeley, Branford, Ezra Stiles, Grace Hopper, Jonathan
  # Edwards, Morse, Saybrook. Their /events pages are 403/404 or hold only a "past events" stub.
  # Not events: Berkeley's /college-resources/reservation-schedule embeds room-booking calendars
  # (two are public, e.g. "Multipurpose Room"), and Morse's "academic calendar" is Yale College's
  # registrar calendar. Saybrook's intramurals Google Calendar (r3jb5ri3vgom4juerqln0bso44) is
  # public but empty.

  # --- Student organizations ----------------------------------------------------------------------

  # Yale Connect (CampusGroups): one public site-wide iCal linked from yaleconnect.yale.edu/events
  # (robots.txt allows /ical/). ~1,700 upcoming events from ~390 orgs, ~3.7 MB. For ~83% the location
  # reads "Sign in to download the location", i.e. members-only; those are skipped (user's call,
  # 2026-09-26), as are meetings, rehearsals, and office hours. Listed last so any other source's copy
  # of an event is canonical (it carries Yale Rep, OISS, and some central-calendar events too).
  - id: yale-connect
    name: Yale Connect
    type: ical
    url: https://yaleconnect.yale.edu/ical/yale/ical_yale.ics
    enabled: true
    options:
      exclude_location: 'sign in to download'
      exclude_tags: 'group meeting|rehearsal|office hours/drop in hours|due date or deadline'
      description_strip: '\s*-{3}\s*Event Details: \S+\s*$'

  # --- Not yet usable -----------------------------------------------------------------------------

  # Also checked: drama.yale.edu/events (robots.txt disallows it), dwighthall.org (The Events
  # Calendar plugin, but 0 upcoming events), som.yale.edu/about/events (no feed; SOM also posts some
  # events to Localist). From www.yale.edu/calendars (2026-09-26): artgallery.yale.edu is behind a
  # Cloudflare bot challenge (not bypassed; YUAG posts its programs to events.yale.edu);
  # divinity.yale.edu/events and ism.yale.edu embed events.yale.edu; art.yale.edu has no events page
  # (/public-events is 404); beinecke.library.yale.edu/calendar redirects to "plan your visit";
  # alumni.yale.edu/events is mostly regional and virtual alumni events; worldfellows events are on
  # the Jackson calendar.
